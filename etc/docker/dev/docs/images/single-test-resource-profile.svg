<g><rect class="card" x="510" y="142" width="426" height="116" rx="17"/><text class="card-label" x="534" y="174">Rucio CPU</text><text class="card-value" x="534" y="214">68.77% avg</text><text class="card-detail" x="534" y="242">97.24% peak</text></g>
<g><rect class="card" x="972" y="142" width="426" height="116" rx="17"/><text class="card-label" x="996" y="174">Rucio memory</text><text class="card-value" x="996" y="214">585 MiB peak</text><text class="card-detail" x="996" y="242">272 PIDs peak</text></g>
