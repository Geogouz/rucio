<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Container resources · one PostgreSQL REST test</title>
  <desc id="desc">Static vector rendering of genuine Docker resource samples for Rucio and PostgreSQL, including CPU, memory, network and process trends.</desc>
  <style>
    .bg{fill:#0b1916}.title{font:700 48px system-ui,sans-serif;fill:#f5faf8}.subtitle{font:26px system-ui,sans-serif;fill:#a9bbb5}.outcome{font:600 22px system-ui,sans-serif;fill:#70d4c1}.card{fill:#122723;stroke:#28564d;stroke-width:2}.card-label{font:20px system-ui,sans-serif;fill:#94aaa3}.card-value{font:700 31px system-ui,sans-serif;fill:#f4faf7}.card-detail{font:19px system-ui,sans-serif;fill:#b8c8c3}.panel rect{fill:#10231f;stroke:#28564d;stroke-width:2}.panel-title{font:700 27px system-ui,sans-serif;fill:#eef7f4}.unit,.legend,.axis{font:18px system-ui,sans-serif;fill:#9fb3ac}.grid{stroke:#29423c;stroke-width:1}.series{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.legend-line{stroke-width:5;stroke-linecap:round}.footer{font:20px system-ui,sans-serif;fill:#90a59e}
  </style>
