services:
  rucio:
    image: "${RUCIO_TEST_IMAGE:?Set RUCIO_TEST_IMAGE to a test runtime image}"
    working_dir: /rucio_source
    environment:
      RDBMS:
      DEV_PROFILES:
      RUCIO_HOME: "${RUCIO_HOME:-/opt/rucio}"
      RUCIO_PYTEST_INNER: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "true"
    volumes:
      - ../../../etc/mail_templates:/opt/rucio/etc/mail_templates:ro
      - ../../../etc/automatix.json:/opt/rucio/etc/automatix.json:ro
      - ../../../etc/google-cloud-storage-test.json:/opt/rucio/etc/google-cloud-storage-test.json:ro
      - ../../../etc/rse_repository.json:/opt/rucio/etc/rse_repository.json:ro
      - vol-test-tmp:/tmp

  ruciodb:
    profiles:
      - donotstart

volumes:
  vol-test-tmp:
    labels:
      rucio.test.database: sqlite
