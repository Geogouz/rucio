name: Cleanup Runtime Images

on:
  schedule:
    - cron: '30 0 * * 0'
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      cleanup_type:
        description: 'Type of cleanup to run'
        required: true
        default: 'both'
        type: choice
        options:
          - untagged
          - tagged
          - both

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Delete expired runtime images
    if: github.repository_owner == 'rucio'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Delete expired package versions
        run: |
          CLEANUP_TYPE="${{ inputs.cleanup_type }}"
          if [[ "${{ github.event.schedule }}" == "30 0 * * 0" ]]; then
            CLEANUP_TYPE=untagged
          elif [[ "${{ github.event.schedule }}" == "0 0 1 * *" ]]; then
            CLEANUP_TYPE=tagged
          fi

          VERSIONS=$(gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/orgs/${{ github.repository_owner }}/packages/container/rucio%2Frucio-dev-runtime/versions?per_page=100")

          cleanup_versions() {
            local kind=$1
            local days=$2
            local cutoff
            cutoff=$(date -u -d "${days} days ago" +%s)

            while read -r version; do
              local id updated tags tag_count updated_epoch
              id=$(jq -r '.id' <<< "$version")
              updated=$(jq -r '.updated_at' <<< "$version")
              tags=$(jq -c '.metadata.container.tags' <<< "$version")
              tag_count=$(jq 'length' <<< "$tags")
              updated_epoch=$(date -u -d "$updated" +%s)

              if [[ "$kind" == "untagged" && "$tag_count" -ne 0 ]]; then
                continue
              fi
              if [[ "$kind" == "tagged" && "$tag_count" -eq 0 ]]; then
                continue
              fi
              if [[ "$kind" == "tagged" ]] && jq -e \
                'any(.[]; contains("buildcache"))' <<< "$tags" > /dev/null; then
                continue
              fi
              if [[ "$updated_epoch" -ge "$cutoff" ]]; then
                continue
              fi

              echo "Deleting ${kind} package version ${id} from ${updated}"
              gh api --method DELETE --silent \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/orgs/${{ github.repository_owner }}/packages/container/rucio%2Frucio-dev-runtime/versions/${id}"
            done < <(jq -c '.[][]' <<< "$VERSIONS")
          }

          if [[ "$CLEANUP_TYPE" == "untagged" || "$CLEANUP_TYPE" == "both" ]]; then
            cleanup_versions untagged 7
          fi
          if [[ "$CLEANUP_TYPE" == "tagged" || "$CLEANUP_TYPE" == "both" ]]; then
            cleanup_versions tagged 30
          fi
