name: VO-specific tests

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime_images:
    name: Build Runtime Images
    uses: ./.github/workflows/runtime_images.yml
    permissions:
      contents: read
      packages: write

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --constraint requirements/requirements.dev.txt pytest pytest-cov pytest-xdist pyyaml
      - name: Generate VO test matrix
        id: cases
        run: |
          cases=$(
            python -bb -m pytest --list-cases |
              jq -ce '[.[] | select(.group == "votest") | {id, python}]
                | if length == 2 then . else error("expected two VO test cases") end'
          )
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
    outputs:
      cases: ${{ steps.cases.outputs.cases }}

  test:
    needs: [runtime_images, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.setup.outputs.cases) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install --constraint requirements/requirements.dev.txt pytest pytest-cov pytest-xdist pyyaml
      - name: Set up Docker Buildx
        if: needs.runtime_images.outputs.build_locally == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set repository variable
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Select runtime image
        id: runtime
        env:
          PY39_IMAGE: ${{ needs.runtime_images.outputs.py39_image }}
          PY310_IMAGE: ${{ needs.runtime_images.outputs.py310_image }}
        run: |
          case "${{ matrix.case.python }}" in
            3.9)
              echo "image=$PY39_IMAGE" >> "$GITHUB_OUTPUT"
              echo "cache=py39" >> "$GITHUB_OUTPUT"
              ;;
            3.10)
              echo "image=$PY310_IMAGE" >> "$GITHUB_OUTPUT"
              echo "cache=py310" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported container Python ${{ matrix.case.python }}" >&2
              exit 1
              ;;
          esac
      - name: Build runtime image locally
        if: needs.runtime_images.outputs.build_locally == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: etc/docker/test/runtime.Dockerfile
          target: final
          build-args: |
            PYTHON=${{ matrix.case.python }}
          push: false
          tags: ${{ steps.runtime.outputs.image }}
          outputs: type=docker
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repo }}/rucio-dev-runtime:${{ steps.runtime.outputs.cache }}-buildcache

      - name: Run ${{ matrix.case.id }}
        env:
          RUCIO_TEST_IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          mkdir -p test-results
          python -bb -m pytest \
            --case="${{ matrix.case.id }}" \
            -v --tb=short \
            --junitxml="test-results/${{ matrix.case.id }}.xml"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.case.id }}
          path: |
            test-results/
            .test-logs/
          if-no-files-found: ignore
