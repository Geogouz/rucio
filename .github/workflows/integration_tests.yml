name: End to End integration tests

on:
  pull_request:
  push:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime_images:
    name: Build Python 3.9 Runtime Image
    uses: ./.github/workflows/runtime_images.yml
    permissions:
      packages: write

  integration-tests:
    needs: [runtime_images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Resolve RUCIO_TAG
        id: rucio_tag
        run: |
          git fetch --tags --force --prune || true
          python3 tools/github/workflow/set_rucio_tag_output_env.py
      - name: Prepare Python 3.9 runtime image
        uses: ./.github/actions/prepare_runtime_image
        with:
          build-locally: ${{ needs.runtime_images.outputs.build_locally }}
          python-version: "3.9"
          runtime-image: ${{ needs.runtime_images.outputs.py39_image }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          login-continue-on-error: "true"
      - name: Run integration workflow sequence
        env:
          RUCIO_TAG: ${{ steps.rucio_tag.outputs.rucio_tag }}
        run: ./tools/test/run_tests.py --mode integration --integration-runtime-image "${{ needs.runtime_images.outputs.py39_image }}" --rucio-tag "${{ steps.rucio_tag.outputs.rucio_tag }}"
