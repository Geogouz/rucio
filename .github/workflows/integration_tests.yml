name: End to End integration tests

on:
  pull_request:
  push:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime_images:
    name: Build Python 3.9 Runtime Image
    uses: ./.github/workflows/runtime_images.yml
    permissions:
      contents: read
      packages: read

  setup:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --constraint requirements/requirements.dev.txt pytest pytest-cov pytest-xdist pyyaml
      - name: Generate integration matrix
        id: cases
        run: |
          cases=$(
            python -bb -m pytest --list-cases |
              jq -ce '[.[] | select(.group == "integration") | {id, python, runtime}]
                | if length == 1 then . else error("expected one integration case") end'
          )
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  integration-tests:
    needs: [runtime_images, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.setup.outputs.cases) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install --constraint requirements/requirements.dev.txt pytest pytest-cov pytest-rerunfailures pytest-xdist pyyaml
      - name: Set up Docker Buildx
        if: fromJSON(needs.runtime_images.outputs.builds)[matrix.case.runtime]
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Set repository variable
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build runtime image locally
        if: fromJSON(needs.runtime_images.outputs.builds)[matrix.case.runtime]
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: etc/docker/test/runtime.Dockerfile
          target: final
          build-args: |
            PYTHON=${{ matrix.case.python }}
          push: false
          tags: ${{ fromJSON(needs.runtime_images.outputs.images)[matrix.case.runtime] }}
          outputs: type=docker
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repo }}/rucio-dev-runtime:${{ matrix.case.runtime }}-buildcache
      - name: Run ${{ matrix.case.id }}
        env:
          RUCIO_TEST_IMAGE: ${{ fromJSON(needs.runtime_images.outputs.images)[matrix.case.runtime] }}
        run: |
          mkdir -p test-results
          python -bb -m pytest \
            --case="${{ matrix.case.id }}" \
            -v --tb=short \
            --junitxml="test-results/${{ matrix.case.id }}.xml"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.case.id }}
          path: |
            test-results/
            .test-logs/
          if-no-files-found: ignore
