name: Build Runtime Images

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish missing runtime images"
        type: boolean
        default: false
    outputs:
      images:
        description: "Runtime image tags keyed by case runtime"
        value: ${{ jobs.resolve_runtime_images.outputs.images }}
      builds:
        description: "Local-build requirements keyed by case runtime"
        value: ${{ jobs.resolve_runtime_images.outputs.builds }}

jobs:
  resolve_runtime_images:
    name: Resolve Runtime Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      images: ${{ steps.resolve.outputs.images }}
      builds: ${{ steps.resolve.outputs.builds }}
      missing: ${{ steps.resolve.outputs.missing }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test registry dependencies
        run: python -m pip install --constraint requirements/requirements.dev.txt pytest pyyaml

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Resolve runtime images
        id: resolve
        run: |
          BUILD_INPUTS=(
            .dockerignore
            etc/docker/test/runtime.Dockerfile
            etc/docker/dev/rucio/entrypoint.sh
            etc/docker/test/extra/00-mpm.conf
            etc/docker/test/extra/httpd.conf
            etc/docker/test/extra/rucio.conf
            etc/certs/hostcert_rucio.key.pem
            etc/certs/hostcert_rucio.pem
            etc/certs/rucio_ca.pem
            etc/certs/ruciouser.key.pem
            etc/certs/ruciouser.pem
            requirements
          )
          RUNTIMES=$(
            python -bb -m pytest --list-cases |
              jq -ce '[.[] | select(.group != "unit") | {
                key: .runtime,
                python: .python,
                target: .runtime_target,
                platform: .runtime_platform
              }] | unique_by(.key)'
          )
          IMAGES='{}'
          BUILDS='{}'
          MISSING='[]'
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          while IFS= read -r RUNTIME; do
            IMAGE_KEY=$(jq -r '.key' <<< "$RUNTIME")
            PYVER=$(jq -r '.python' <<< "$RUNTIME")
            TARGET=$(jq -r '.target' <<< "$RUNTIME")
            PLATFORM=$(jq -r '.platform // ""' <<< "$RUNTIME")
            HASH=$(
              {
                echo "PYTHON=${PYVER}"
                echo "TARGET=${TARGET}"
                echo "PLATFORM=${PLATFORM:-native}"
                git ls-files -s -- "${BUILD_INPUTS[@]}"
              } |
                sha256sum | cut -d' ' -f1 | head -c 12
            )
            IMAGE="ghcr.io/${REPO}/rucio-dev-runtime:${IMAGE_KEY}-${HASH}"
            BUILD=false
            echo "Python ${PYVER} image tag: $IMAGE"

            if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              if [[ "${{ inputs.publish }}" == "true" ]]; then
                MISSING=$(jq -c \
                  --arg key "$IMAGE_KEY" \
                  --arg python "$PYVER" \
                  --arg target "$TARGET" \
                  --arg platform "$PLATFORM" \
                  --arg image "$IMAGE" \
                  '. + [{
                    key: $key,
                    python: $python,
                    target: $target,
                    platform: (if $platform == "" then null else $platform end),
                    image: $image
                  }]' <<< "$MISSING")
              else
                BUILD=true
              fi
            fi

            IMAGES=$(jq -c --arg key "$IMAGE_KEY" --arg image "$IMAGE" \
              '. + {($key): $image}' <<< "$IMAGES")
            BUILDS=$(jq -c --arg key "$IMAGE_KEY" --argjson build "$BUILD" \
              '. + {($key): $build}' <<< "$BUILDS")
          done < <(jq -c '.[]' <<< "$RUNTIMES")

          {
            echo "images=$IMAGES"
            echo "builds=$BUILDS"
            echo "missing=$MISSING"
          } >> "$GITHUB_OUTPUT"

  publish_runtime_images:
    name: Publish Runtime Images
    needs: resolve_runtime_images
    if: inputs.publish && needs.resolve_runtime_images.outputs.missing != '[]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: metadata
        run: |
          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "commit_sha=${{ github.sha }}"
            echo "commit_ref=${{ github.ref }}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish runtime images
        run: |
          BUILD_DATE="${{ steps.metadata.outputs.build_date }}"
          COMMIT_SHA="${{ steps.metadata.outputs.commit_sha }}"
          COMMIT_REF="${{ steps.metadata.outputs.commit_ref }}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          while IFS= read -r RUNTIME; do
            IMAGE_KEY=$(jq -r '.key' <<< "$RUNTIME")
            PYVER=$(jq -r '.python' <<< "$RUNTIME")
            TARGET=$(jq -r '.target' <<< "$RUNTIME")
            PLATFORM=$(jq -r '.platform // ""' <<< "$RUNTIME")
            IMAGE=$(jq -r '.image' <<< "$RUNTIME")
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Python ${PYVER} image already exists, skipping build"
              continue
            fi

            echo "Building Python ${PYVER} image..."
            PLATFORM_ARGS=()
            if [[ -n "$PLATFORM" ]]; then
              PLATFORM_ARGS+=(--platform "$PLATFORM")
            fi
            docker buildx build \
              --file etc/docker/test/runtime.Dockerfile \
              --target "$TARGET" \
              "${PLATFORM_ARGS[@]}" \
              --build-arg "PYTHON=${PYVER}" \
              --push \
              --tag "$IMAGE" \
              --label "org.opencontainers.image.title=Rucio Runtime Image Python ${PYVER}" \
              --label "org.opencontainers.image.description=Runtime image for Rucio autotests with Python ${PYVER}" \
              --label "org.opencontainers.image.version=${IMAGE##*:}" \
              --label "org.opencontainers.image.created=${BUILD_DATE}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
              --label "org.opencontainers.image.ref.name=${COMMIT_REF}" \
              --label "rucio.image.python.version=${PYVER}" \
              --label "rucio.image.build.date=${BUILD_DATE}" \
              --label "rucio.image.build.workflow=${{ github.workflow }}" \
              --label "rucio.image.build.run_id=${{ github.run_id }}" \
              --cache-from "type=registry,ref=ghcr.io/${REPO}/rucio-dev-runtime:${IMAGE_KEY}-buildcache" \
              --cache-to "type=registry,ref=ghcr.io/${REPO}/rucio-dev-runtime:${IMAGE_KEY}-buildcache,mode=max" \
              .
          done < <(jq -c '.[]' <<< '${{ needs.resolve_runtime_images.outputs.missing }}')
