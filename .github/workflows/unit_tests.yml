name: Unit Tests

on:
  pull_request:
  push:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --constraint requirements/requirements.dev.txt pytest pytest-cov pytest-xdist pyyaml
      - name: Generate unit matrix
        id: cases
        run: |
          cases=$(
            python -bb -m pytest --list-cases |
              jq -ce '[.[] | select(.group == "unit") | {id, python}]
                | if length >= 5 then . else error("expected at least five unit cases") end'
          )
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.setup.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install test runner
        run: python -m pip install --constraint requirements/requirements.dev.txt pytest pytest-cov pytest-rerunfailures pytest-xdist pyyaml
      - name: Run ${{ matrix.case.id }}
        run: |
          mkdir -p test-results
          python -bb -m pytest \
            --case="${{ matrix.case.id }}" \
            -v --tb=short \
            --junitxml="test-results/${{ matrix.case.id }}.xml"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.case.id }}
          path: |
            test-results/
            .test-logs/
          if-no-files-found: ignore
