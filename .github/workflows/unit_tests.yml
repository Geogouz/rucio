name: Unit Tests

on:
  pull_request:
  push:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    uses: ./.github/workflows/prepare_matrix.yml
    with:
      matrix-command: ./tools/test/run_tests.py --print-unit-test-matrix

  test:
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libkrb5-dev gcc libxmlsec1 libxmlsec1-dev
          python -m pip install --upgrade pip setuptools wheel xmlsec==1.3.13

      - name: Install dev dependencies
        run: pip install -r requirements/requirements.dev.txt

      - name: Run unit tests
        run: pytest tests/rucio
