name: Prepare test matrix

on:
  workflow_call:
    inputs:
      matrix-command:
        description: Command that prints matrix JSON for workflow strategy expansion.
        required: true
        type: string
    outputs:
      matrix:
        description: Generated matrix JSON.
        value: ${{ jobs.setup.outputs.matrix }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Identify Matrix
        id: matrix
        shell: bash
        run: |
          matrix="$(bash -lc "$MATRIX_COMMAND")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_COMMAND: ${{ inputs.matrix-command }}
